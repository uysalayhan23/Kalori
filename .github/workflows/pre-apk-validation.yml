name: Kalori pre-APK checks (no APK build)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pre-apk-validation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate imported catalog and run all pre-APK tests
        run: python tools/verify_pre_apk.py --release
      - name: Check HTML inline JavaScript syntax
        run: |
          node - <<'NODE'
          const fs=require('fs');
          for(const file of ['index.html','foods.html','meal-builder.html','profile.html','barcode.html','history.html']){
            const html=fs.readFileSync(file,'utf8');
            const matches=[...html.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/g)];
            for(const [i,match] of matches.entries())new Function(match[1]);
            console.log(file,':',matches.length,'inline scripts syntax OK');
          }
          NODE
